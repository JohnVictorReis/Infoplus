buildscript {
    ext.kotlin_version = '2.1.10' // Atualizando para Kotlin 2.1.10

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version" // Usando a versão 2.1.10
        classpath 'com.android.tools.build:gradle:8.2.1' // Verifique se a versão do AGP é compatível
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
