plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Definindo a versão do Kotlin
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.example.projeto_infoplus"
    // Atualizando a versão do SDK para 35, tendo em vista atualização do gradle e AGP
    compileSdkVersion 35
    //flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        // Atualizado para compatibilidade com AGP 8.2.1 e Java 21
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17' // Atualizado para compatibilidade com AGP 8.2.1 e Java 21
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Especificar seu próprio ID único de aplicação (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.example.projeto_infoplus"
        
        // Definindo o minSdkVersion e targetSdkVersion no lugar correto
        minSdkVersion 23
        targetSdkVersion 35  // Agora dentro do bloco defaultConfig
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    buildTypes {
        release {
            // TODO: Adicionar sua própria configuração de assinatura para a versão release.
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    // Atualizando a versão do Kotlin Gradle Plugin
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'com.google.android.gms:play-services-base:18.2.0' // A versão pode ser mais atual
}
